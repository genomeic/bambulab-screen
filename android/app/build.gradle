plugins {
  id 'com.android.application'
}

android {
  namespace 'com.bambulab.p1screen'
  compileSdk 36

  defaultConfig {
    applicationId 'com.bambulab.p1screen'
    minSdk 21
    targetSdk 34
    // Bump on every shipped build — the filename and the in-app "current
    // version" row both read this, so it is the only way for the user to
    // tell a new package from the previous one.
    versionCode 2
    versionName (System.getenv("APP_VERSION_NAME") ?: "0.2.0")
  }

  signingConfigs {
    release {
      storeFile file('../../../p1screen.keystore')
      storePassword 'p1screen2026'
      keyAlias 'p1screen'
      keyPassword 'p1screen2026'
    }
  }

  buildTypes {
    debug {
      minifyEnabled false
      signingConfig signingConfigs.release
    }
    release {
      minifyEnabled true
      signingConfig signingConfigs.release
    }
  }

  sourceSets {
    main {
      assets.srcDirs = ['src/main/assets', '../../dist']
    }
  }
}

dependencies {
  implementation 'org.nanohttpd:nanohttpd-websocket:2.3.1'
  implementation 'com.squareup.okhttp3:okhttp:4.12.0'
  implementation 'androidx.core:core-splashscreen:1.0.1'
}

// Frontend dist is built separately via `npx vite build --config frontend/vite.config.ts`
// (running vite from Gradle crashed and wiped dist mid-build). Just verify it exists.
tasks.register('buildWebAssets') {
  doLast {
    if (!file('../../dist/web/index.html').exists()) {
      throw new GradleException('dist/web/index.html missing - run vite build first')
    }
  }
}
preBuild.dependsOn buildWebAssets

tasks.register('copyApkToDist', Copy) {
  from layout.buildDirectory.dir("outputs/apk")
  // Must NOT land inside ../../dist: assets.srcDirs includes ../../dist, so a
  // copy there gets packaged into the next build and inflates every APK.
  into "../../apk_out"
  include "**/*.apk"
  includeEmptyDirs = false
}

afterEvaluate {
  tasks.matching { it.name.startsWith("assemble") }.configureEach {
    finalizedBy('copyApkToDist')
  }
}
